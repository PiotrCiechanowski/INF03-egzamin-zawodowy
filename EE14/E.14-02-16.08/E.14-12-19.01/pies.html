<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasze zdjęcia</title>
    <link rel="stylesheet" href="styl6.css">
</head>
<body>
    <header class="baner">
        <h2>Nasze psy</h2>
    </header>
    <aside class="lewy">
        <h1>Wybierz</h1>
        <ul>
            <li><a href="pies.html">Psy</a></li>
            <li><a href="kot.html">Koty</a></li>
            <li>Konie</li>
            <li>Rybki</li>
            <li>Inne zdjęcia</li>
        </ul>
        <h5><a href="index.html">Do strony głównej</a></h5>
    </aside>
    <article class="prawy1">
        <h2>Kliknij na zdjęcie</h2>
        <img src="pies1.jpg" alt="psy" onclick="" onmouseover="" onmouseout="" id="pies1">
        <img src="pies2.jpg" alt="psy" onclick="" onmouseover="" onmouseout="" id="pies2">
        <img src="pies3.jpg" alt="psy" onclick="" onmouseover="" onmouseout="" id="pies3">
    </article>
    <main class="prawy2">
        <p><img src="pies2.jpg" alt="Wybrany pies" id="wybrany"></p>
    </main>
    <footer>
        Galerię zdjęć opracował: <b>00000000000</b>
    </footer>
    <script>
        document.getElementById("pies1").addEventListener('mouseover', function(){
            document.getElementById("pies1").src = 'pies1-odbicie.jpg';
        })
        document.getElementById("pies1").addEventListener('mouseout', function(){
            document.getElementById("pies1").src = 'pies1.jpg';
        })
        document.getElementById("pies1").addEventListener('click', function (){
            document.getElementById("pies1").src = 'pies1.jpg';
            document.getElementById("wybrany").src = 'pies1.jpg';
        })

        document.getElementById("pies2").addEventListener('mouseover', function(){
            document.getElementById("pies2").src = 'pies2-odbicie.jpg';
        })
        document.getElementById("pies2").addEventListener('mouseout', function(){
            document.getElementById("pies2").src = 'pies2.jpg';
        })
        document.getElementById("pies2").addEventListener('click', function (){
            document.getElementById("pies2").src = 'pies2.jpg';
            document.getElementById("wybrany").src = 'pies2.jpg';
        })


        document.getElementById("pies3").addEventListener('mouseover', function(){
            document.getElementById("pies3").src = 'pies3-odbicie.jpg';
        })
        document.getElementById("pies3").addEventListener('mouseout', function(){
            document.getElementById("pies3").src = 'pies3.jpg';
        })
        document.getElementById("pies3").addEventListener('click', function (){
            document.getElementById("pies3").src = 'pies3.jpg';
            document.getElementById("wybrany").src = 'pies3.jpg';
        })


    </script>
</body>
</html>
